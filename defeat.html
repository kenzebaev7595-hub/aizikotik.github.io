<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вы проиграли</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>

<div class="defeat">
    <h1>Вы проиграли!</h1>
    <p>Попытки: <span id="attempts"></span></p>
    <p>Очки: <span id="points"></span></p>
    <button onclick="startNewGame()">Заново</button>
</div>

<audio id="defeat-music" autoplay loop>
    <source src="defeat.mp3" type="audio/mpeg">
</audio>

<script>
document.getElementById("points").innerText = localStorage.getItem("points") || 0;
document.getElementById("attempts").innerText = localStorage.getItem("attempts") || 0;
</script>
</body>
</html>
