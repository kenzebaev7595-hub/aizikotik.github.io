<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Админка</title>

    <link rel="stylesheet" href="style.css">

    <!-- 🔥 Firebase (обязательно ДО script.js) -->

    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>

    <!-- ⚠️ ВАЖНО: defer -->

</head>

<body>

<a href="index.html" class="menu-btn">Меню</a>
<button id="music-btn" onclick="toggleMusic()">🔊 ON</button>

<audio id="bg-music" loop>

</audio>

<div id="levels"></div>

<hr>

<button onclick="clearLogs()">🧹 Очистить логи</button>

<div id="logs"></div>

<!-- -------------------- ЗАПУСК -------------------- -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    loadAdmin();
    loadLevelsAdmin();
});
</script>

</body>
</html>
